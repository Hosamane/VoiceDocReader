name: voicedocreader
description: A standalone offline document reader with TTS and voice commands.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  file_picker: ^6.2.1
  flutter_tts: ^3.8.5
  speech_to_text: ^6.6.2
  syncfusion_flutter_pdf: ^23.2.7
  docx_to_text: ^1.0.1
  permission_handler: ^11.0.1
  path_provider: ^2.1.3
  intl: ^0.18.1
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3

flutter:
  uses-material-design: true
