name: voicedocreader
description: A standalone offline document reader with TTS and voice commands.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  file_picker: ^6.1.1
  flutter_tts: ^3.8.3
  speech_to_text: ^6.3.0
  syncfusion_flutter_pdf: ^23.1.40
  docx_to_text: ^1.0.0
  permission_handler: ^11.0.1
  path_provider: ^2.1.1
  intl: ^0.18.1
  provider: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
